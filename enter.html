<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pandora34 — вход</title>
  <style>
    :root{--neon:#4fc7ea;--neon-glow:rgba(79,199,234,.35)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1730;font-family:Arial,sans-serif;padding:24px}
    .box{width:min(420px,100%);background:#152544;border:1.5px solid var(--neon);border-radius:18px;padding:28px 24px;box-shadow:0 0 40px var(--neon-glow)}
    h1{margin:0 0 8px;color:#fff;font-size:22px}
    .hint{color:#9eb0cc;margin:0 0 18px;font-size:14px;line-height:1.4}
    label{display:block;color:#9eb0cc;font-size:12px;font-weight:700;margin:0 0 6px}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #2a3f66;background:#101e38;color:#fff;font-size:16px;margin-bottom:14px}
    input:focus{outline:none;border-color:var(--neon)}
    button{width:100%;border:1.5px solid var(--neon);background:#1b3a63;color:#fff;border-radius:10px;padding:12px;font-size:16px;font-weight:800;cursor:pointer}
    .err{color:#ff8a8a;font-size:13px;font-weight:700;margin:0 0 10px;min-height:18px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Pandora34</h1>
    <p class="hint">Телефон и компьютер запоминают этот вход. Пароль тот же, что был в сером окне сайта.</p>
    <p class="err" id="err"></p>
    <form method="post" action="/auth/web-login-form" autocomplete="on">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
  </div>
  <script>
    if(/[?&]err=1/.test(location.search)) document.getElementById('err').textContent='Неверный логин или пароль';
  </script>
</body>
</html>
